[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "meertex"
version = "0.1.0"
description = "The meertex CLI: projects, versions and the live sync client."
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
    "httpx==0.28.1",
    "pycrdt==0.14.10",
    "diff-match-patch==20241021",
    "websockets==17.3",
    "watchfiles==1.3.0",
    "pathspec==1.1.1",
]

[project.scripts]
meertex = "meertex.__main__:main"

[tool.setuptools]
packages = ["meertex"]
