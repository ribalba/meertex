# meertex on Coolify: Postgres, the server and the compile service, as one
# resource.
#
# Point a Coolify "Docker Compose" resource at this repository and set the
# compose path to `/docker-compose.coolify.yml`. COOLIFY.md walks the deploy.
#
# How this differs from docker-compose.yml, and why (meerpad's reasons):
#
#   * Nothing is published to the host. `web` is reached through Coolify's
#     Traefik, which also terminates TLS and passes WebSockets (the sync
#     endpoint) through as they are. Set the domain on the `web` service in
#     the Coolify UI (`https://meertex.com:8000`). `db` has no
#     host-facing address at all.
#
#   * No `networks:` and no `name:`. Coolify creates the project network and
#     names the project after the resource's UUID itself.
#
#   * No secrets with defaults. The Postgres password, SECRET_KEY and the
#     compile token are Coolify magic variables, generated once and reused on
#     every redeploy.
#
#   * BASE_URL is required (`:?`). Coolify marks it in the UI and refuses the
#     deploy while it is empty.

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meertex}
      # Generated by Coolify: 32 letters and digits, so it can sit inside
      # DATABASE_URL below without percent-encoding.
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-meertex}
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meertex} -d ${POSTGRES_DB:-meertex}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        MEERTEX_VERSION: ${MEERTEX_VERSION:-0.0.0}
    depends_on:
      db:
        condition: service_healthy
    # `expose`, not `ports`. Traefik reaches the container over the project
    # network. Set the domain on this service in the Coolify UI (Domains:
    # `https://meertex.com:8000`, the `:8000` names the container port).
    expose:
      - "8000"
    environment:
      BASE_URL: ${BASE_URL:?set BASE_URL to the app's public address, e.g. https://meertex.com}
      SECRET_KEY: ${SERVICE_PASSWORD_64_MEERTEX}

      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-meertex}:${SERVICE_PASSWORD_POSTGRES}@db:5432/${POSTGRES_DB:-meertex}
      DATA_DIR: /data

      MAX_TEXT_BYTES: ${MAX_TEXT_BYTES:-2097152}
      MAX_BLOB_BYTES: ${MAX_BLOB_BYTES:-52428800}
      MAX_SYNC_MESSAGE_BYTES: ${MAX_SYNC_MESSAGE_BYTES:-67108864}
      SNAPSHOT_IDLE_SECONDS: ${SNAPSHOT_IDLE_SECONDS:-60}
      SNAPSHOT_MAX_SECONDS: ${SNAPSHOT_MAX_SECONDS:-600}
      ROOM_IDLE_SECONDS: ${ROOM_IDLE_SECONDS:-300}

      # The `compile` service below (docs/DESIGN.md §14), over the project
      # network. Both sides read the same generated token.
      COMPILE_URL: http://compile:8000
      COMPILE_TOKEN: ${SERVICE_PASSWORD_64_COMPILE}
      COMPILE_TIMEOUT_SECONDS: ${COMPILE_TIMEOUT_SECONDS:-90}

      # The reference check (docs/DESIGN.md §16). The claim check needs a key.
      REFERENCES_NETWORK: ${REFERENCES_NETWORK:-true}
      REFERENCES_MAILTO: ${REFERENCES_MAILTO:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      REFERENCES_CLAUDE_MODEL: ${REFERENCES_CLAUDE_MODEL:-claude-opus-5-5}

      # Spelling and grammar in the editor (docs/DESIGN.md §17), checked by the
      # `languagetool` service below over the project network.
      GRAMMAR_URL: ${GRAMMAR_URL:-http://languagetool:8010}
      GRAMMAR_TIMEOUT_SECONDS: ${GRAMMAR_TIMEOUT_SECONDS:-20}
      GRAMMAR_ALLOW_PUBLIC_HOSTS: ${GRAMMAR_ALLOW_PUBLIC_HOSTS:-false}
      GRAMMAR_MAX_CONCURRENT: ${GRAMMAR_MAX_CONCURRENT:-3}

      # The daily reminder mails before deadlines (docs/DESIGN.md §5).
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-true}

      LOGIN_TOKEN_TTL_MINUTES: ${LOGIN_TOKEN_TTL_MINUTES:-30}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-43200}
      LOGIN_CODE_MAX_ATTEMPTS: ${LOGIN_CODE_MAX_ATTEMPTS:-5}
      LOGIN_RATE_MAX: ${LOGIN_RATE_MAX:-5}
      VERIFY_RATE_MAX: ${VERIFY_RATE_MAX:-15}
      LOGIN_RATE_WINDOW_MINUTES: ${LOGIN_RATE_WINDOW_MINUTES:-15}

      # Without SMTP_HOST the sign-in link and code go to the container log,
      # which is how you sign in the very first time, and nobody else can.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_FROM: ${EMAIL_FROM:-hello@meertex.com}
      # One mail for every new account, at its first sign-in (docs/DESIGN.md §2).
      NEW_USER_MAIL_TO: ${NEW_USER_MAIL_TO:-}
    volumes:
      # Every project's git history and blobs. Back it up with pg-data.
      - meertex-data:/data
    restart: unless-stopped

  # TeX Live and a small HTTP service that compiles (compile/README.md). It
  # gets no domain and no ports. Only `web` talks to it, with the token.
  compile:
    build:
      context: compile
      args:
        MEERTEX_VERSION: ${MEERTEX_VERSION:-0.0.0}
    expose:
      - "8000"
    environment:
      COMPILE_TOKEN: ${SERVICE_PASSWORD_64_COMPILE}
      COMPILE_TIMEOUT_SECONDS: ${COMPILE_TIMEOUT_SECONDS:-90}
      COMPILE_KEEP_JOBS: ${COMPILE_KEEP_JOBS:-30}
      COMPILE_WORKERS: ${COMPILE_WORKERS:-2}
    # A real init as PID 1 reaps what a killed job leaves behind.
    init: true
    read_only: true
    tmpfs:
      # HOME and the font caches. exec, because TeX Live's biber unpacks a
      # Perl interpreter into /tmp and runs it from there.
      - /tmp:size=512m,exec
    volumes:
      # The job folders, kept for SyncTeX. The service removes old ones, and
      # nothing in here needs a backup.
      - compile-jobs:/jobs
    mem_limit: ${COMPILE_MEMORY:-2g}
    cpus: ${COMPILE_CPUS:-2}
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Spelling and grammar (docs/DESIGN.md §17) are checked by LanguageTool in
  # the community image, up to 1.3 GB resident once two languages are loaded.
  # It gets no domain and no ports. It has no authentication at all, and only
  # `web` talks to it. `web` does not wait for it, the app works without it.
  languagetool:
    image: erikvl87/languagetool:6.8
    expose:
      - "8010"
    environment:
      # The JVM's initial and maximum heap, which the image's start.sh passes on.
      Java_Xms: 256m
      Java_Xmx: 768m
      # Sentences whose results LanguageTool keeps. The server caches whole
      # paragraphs on top of that (app/grammar/checker.py).
      langtool_cacheSize: "2000"
    mem_limit: ${LANGUAGETOOL_MEMORY:-1536m}
    healthcheck:
      # One small English check, which also loads English before anybody types.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null --data 'language=en-US&text=a simple test' http://localhost:8010/v2/check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  pg-data:
  meertex-data:
  compile-jobs:
